# /etc/nginx/sites-available/books-api
#
# Nginx reverse proxy config for the Books API.
# Proxies port 80 → Express app on port 3000.
#
# Setup steps (Ubuntu/Debian):
#   sudo ln -s /etc/nginx/sites-available/books-api /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

upstream books_api {
    # Round-robin across PM2 cluster workers (all bound to port 3000)
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # replace with your domain or IP

    # Security headers (complement Helmet on Express side)
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    # Limit request body size (mirror Express 10kb limit + some headroom)
    client_max_body_size 1M;

    # Logging
    access_log /var/log/nginx/books-api.access.log;
    error_log  /var/log/nginx/books-api.error.log;

    # Proxy all traffic to Express
    location / {
        proxy_pass         http://books_api;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint — don't log it
    location /health {
        proxy_pass         http://books_api;
        access_log         off;
    }

    # Block access to hidden files (e.g. .env)
    location ~ /\. {
        deny all;
        return 404;
    }
}

# Optional: redirect HTTP → HTTPS once you add a TLS certificate
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$host$request_uri;
# }